<!-- @dsCard height=288 -->
<!doctype html>
<html lang="zh"><head><style>
html,body{margin:0;padding:0}
.cv{position:relative;width:960px;height:288px;overflow:hidden;background:var(--paper)}
.cv svg{position:absolute;inset:0}
.ink{fill:var(--ink)}
.ink2{fill:var(--ink-2)}
.c{fill:var(--c)}
.r{stroke:var(--ink);stroke-width:1}
.g{stroke:var(--paper);stroke-width:1}
.d{fill:var(--ink)}
.b{rx:var(--radius-0)}
.nm{position:absolute;left:48px;bottom:44px;max-width:440px}
.nm h1{margin:0;font-family:var(--font-t);font-weight:400;font-size:104px;line-height:.95;letter-spacing:.02em;color:var(--ink)}
.nm p{margin:14px 0 0;font-family:var(--font-b);font-size:14px;line-height:1.5;color:var(--ink-3)}
</style></head><body>
<div class="cv">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
<!--
blocks: ink 300x230 slab bleeding off the top (≈3×space-section), c 150x110 staggered under it, ink-2 120x120 bleeding off the right and bottom; corners radius-0
arrangement: staggered, cut by the top and right edges — 大小不同的颜料块错开并被边缘裁切 (§5.4)
pattern: a literal motif, the system's own status glyph «一条线一个点»: three 1px rules in ink, scraped to paper grooves where they cross a block, one 15px radius-dot on the lowest
scales: space-section 96 pitch for the first rule, radius-0 blocks, radius-dot dot
-->
<rect class="ink b" x="600" y="-20" width="300" height="230"/>
<rect class="c b" x="520" y="150" width="150" height="110"/>
<rect class="ink2 b" x="860" y="196" width="120" height="120"/>
<line class="r" x1="480" y1="96" x2="960" y2="96"/>
<line class="g" x1="600" y1="96" x2="900" y2="96"/>
<line class="r" x1="480" y1="128" x2="960" y2="128"/>
<line class="g" x1="600" y1="128" x2="900" y2="128"/>
<line class="r" x1="480" y1="236" x2="960" y2="236"/>
<line class="g" x1="520" y1="236" x2="670" y2="236"/>
<line class="g" x1="860" y1="236" x2="960" y2="236"/>
<circle class="d" cx="760" cy="228.5" r="7.5"/>
</svg>
<div class="nm"><h1>肥肥主义</h1><p>每一笔都是一次选择。</p></div>
</div>
</body></html>
