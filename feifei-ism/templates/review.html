<div class="w">
<header>
  <div>
    <div class="t">2026-11-12　项目名　待定　第乙签</div>
    <h1>两到四个字的名字</h1>
    <div class="en">English name</div>
  </div>

</header>

<section data-t="结论">
  <h2>结论</h2>
  <div class="pp">

      <p><b>一句话：推荐做什么。</b>再一两句说为什么。</p>

    </div>

  </div>
</section>

  </div>
</section>

<script>
/*@include:paper.js*/
/*@include:motion.js*/
(function(){
 const Q=[
  ['第一件事','每个选项会怎样，推荐哪个、为什么。',['推荐的做法','另一种做法'],0],
  ['第二件事','同上。',['做','先不做'],0],
 ];
 const box=document.getElementById('qs'),pick={};
 Q.forEach(([t,why,opts,def],i)=>{const r=document.createElement('div');r.className='it';
  const d=document.createElement('div');d.className='d';const b=document.createElement('b');b.textContent=(i+1)+'　'+t;const s=document.createElement('span');s.textContent=why;d.append(b,s);
  const c=document.createElement('div');c.className='cap';c.setAttribute('role','group');c.setAttribute('aria-label',t);
  opts.forEach((o,j)=>{const x=document.createElement('button');x.type='button';x.className='k2';x.textContent=o+(j===def?'（推荐）':'');x.setAttribute('aria-pressed',j===def);x.onclick=()=>{[...c.children].forEach(y=>y.setAttribute('aria-pressed',y===x));pick[i]=o};c.append(x)});
  pick[i]=opts[def];r.append(d,c);box.append(r)});
 if(window.FF&&FF.buttons)FF.buttons(box);
 const out=document.getElementById('out');
 document.getElementById('copy').addEventListener('click',()=>{
  const txt=[document.querySelector('h1').textContent+'，我的选择：'].concat(Q.map((q,i)=>`${i+1}. ${q[0]}：${pick[i]}`)).join('\n');
  out.textContent=txt;
  const fail=()=>{out.textContent=txt+'\n\n没能自动复制，选中上面几行手动复制。'};
  try{navigator.clipboard.writeText(txt).then(()=>{out.textContent=txt+'\n\n已复制，贴回对话里就行。'},fail)}catch(e){fail()}
 });
})();
/*@include:partners.js*/
</script>
