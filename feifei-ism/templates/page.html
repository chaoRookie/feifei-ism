<style>

*{box-sizing:border-box}
body,.deck{background-color:var(--paper);background-image:url(__ASSET:paper/xuan_fiber.webp__),url(__ASSET:paper/xuan_cloud.webp__);background-size:768px,1181px;background-blend-mode:multiply,multiply}
body{margin:0;color:var(--ink-2);font-family:var(--f-b);font-size:16.5px;line-height:1.9;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));overflow-x:clip}
.w{max-width:60rem;margin:0 auto}
.t{font-family:var(--f-m);font-size:.74rem;color:var(--ink-3);letter-spacing:.04em}
h1{font-family:var(--f-t);font-weight:400;font-size:1.3rem;margin:.2rem 0 0;letter-spacing:.14em;color:var(--ink)}
h2{font-family:var(--f-b);font-weight:400;font-size:1rem;margin:0;letter-spacing:.1em;color:var(--ink)}
b{font-weight:400;color:var(--ink)}
blockquote{margin:2.4rem 0;color:var(--ink);font-size:1.12rem;line-height:1.7}
a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink-3)}
.en{font-family:var(--f-e);font-style:italic;font-size:1.1rem;color:var(--ink-2)}
header{padding-block:3.5rem 2rem;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem;align-items:end;min-height:26rem}
header .sign{width:min(240px,100%);justify-self:end}
section{padding-block:96px 0}
section p{margin:0 0 1.5em;max-width:30rem}
.pp{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,3fr);column-gap:80px;margin-top:.9rem}
.pp>*{min-width:0}
.pi{font-size:.8rem;line-height:1.75;color:var(--ink-3)}
img{display:block;max-width:100%}
.wide{width:100%;margin-top:2rem}
.dense{width:100vw;max-width:100vw;margin:4.5rem calc(50% - 50vw) 0}
.dense .zi{width:100%}
.cap{display:flex;gap:1rem;flex-wrap:wrap;align-items:center;margin-top:1rem}
button{font:inherit;color:inherit;background:none;border:0;border-radius:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:1px dotted var(--ink);outline-offset:3px}
button[role=switch]{position:relative;width:88px;height:46px;flex:none}
button[role=switch]::before{content:"";position:absolute;left:4px;right:4px;bottom:14px;height:1px;background:var(--ink)}
button[role=switch]::after{content:"";position:absolute;left:4px;bottom:15px;width:15px;height:15px;border-radius:50%;background:var(--ink-3);transition:left var(--t-release) var(--e-out),background-color var(--t-hover)}
button[role=switch][aria-checked=true]::after{left:calc(100% - 19px);background:var(--c)}
button[role=switch] span{position:absolute;right:4px;top:2px;font-size:.82rem;line-height:1.4;color:var(--ink-3)}
button[role=switch][aria-checked=true] span{right:auto;left:4px;color:var(--ink)}
@media (prefers-reduced-motion:reduce){button[role=switch]::after{transition:none}}
.scene{position:relative;height:5rem;max-width:30rem;margin-top:1rem}
.ln{position:absolute;left:0;right:0;bottom:1.2rem;height:1px;background:var(--ink)}
.dt{position:absolute;width:15px;height:15px;border-radius:50%;background:var(--ink);bottom:calc(1.2rem + 1px);left:0}
.loading .dt{animation:w 3.6s cubic-bezier(.45,.05,.55,.95) infinite alternate}
@keyframes w{to{left:calc(100% - 15px)}}
.saving .dt{left:62%;animation:hop .9s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-9px)}}
.ok .dt{left:calc(100% - 15px)}
.empty .dt{display:none}
.error .ln{right:38%}
.error .dt{left:calc(62% + 8px);bottom:0;background:var(--c);animation:fall .7s cubic-bezier(.5,0,.9,.4) both}
@keyframes fall{from{bottom:calc(1.2rem + 1px);left:calc(62% - 8px)}}
canvas{display:block;width:100%;height:auto}
[hidden]{display:none!important}
.note{font-size:.8rem;color:var(--ink-3);margin-top:.8rem}
.deck{position:relative;aspect-ratio:16/9;margin-top:1.5rem;border:1px solid var(--line);overflow:hidden;container-type:inline-size}
.sl{position:absolute;inset:0;visibility:hidden}
.sl.on{visibility:visible}
.cap-text{display:none;font-size:.95rem;margin-top:.6rem}
@media (max-width:640px){.cap-text{display:block}}
.sl .tt{position:absolute;left:5cqw;top:5cqw;font-family:var(--f-m);font-size:1.25cqw;color:var(--ink-3)}
.sl .h{position:absolute;left:5cqw;bottom:6cqw;font-family:var(--f-t);font-size:3cqw;letter-spacing:.08em}
.sl .s{position:absolute;left:5cqw;bottom:5cqw;font-size:1.9cqw;max-width:42cqw}
.sl>.zi{position:absolute}
.mate{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));width:56px;height:56px;image-rendering:pixelated;pointer-events:none;z-index:7}
.swim{position:fixed;left:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:96px;height:80px;image-rendering:pixelated;pointer-events:none;z-index:5}
.swim.on{pointer-events:auto;cursor:pointer}
footer{margin-top:5rem;padding-block:1.1rem 3rem;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2rem;align-items:end}
footer .n a{display:flex;gap:.8rem;font-size:.86rem;padding:.25rem 0;border:0}
footer .n span{font-size:.74rem;color:var(--ink-3);min-width:2.6em}
footer .m{font-family:var(--f-m);font-size:.7rem;color:var(--ink-3);line-height:1.8;margin-top:1rem}
footer .up{margin-top:.5rem}
.k{display:flex;gap:.55rem;align-items:flex-end}
.v{writing-mode:vertical-rl;font-size:.84rem;letter-spacing:.3em;color:var(--ink)}
.seal{position:relative;width:2.3rem;height:2.3rem;min-height:0;background:var(--c);text-align:center;color:var(--paper);font-family:var(--f-t);font-size:.82rem;line-height:1.05;display:grid;grid-template-columns:1fr 1fr;place-items:center;padding:.2rem;transform:rotate(-1.5deg)}
@media print{.seal{opacity:1!important}}
@media (max-width:640px){header{grid-template-columns:1fr;min-height:0}header .sign{justify-self:start;width:160px}.pp{display:block}.pi{border-left:1px solid var(--ink);padding-left:.8rem;margin:0 0 1.5em}footer{gap:1rem}}
@media (prefers-reduced-motion: reduce){.dt{animation:none!important}.loading .dt{left:40%}}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
</style>

<div class="w">
<header>
  <div>
    <div class="t">纪年　人或事　第乙签</div>
    <h1>小标题</h1>
    <div class="en">English Title</div>
  </div>
  <span class="sign zi" id="first" role="img" aria-label="这个字写的是什么" style="--r:url(__ASSET:signs/sign_one_relief.webp__)"><i></i><img src="__ASSET:signs/sign_one_ink.webp__" alt=""></span>
</header>

<section>
  <h2>一件小事</h2>
  <div class="pp">
    <div><p><b>要紧的一句用全黑。</b></p><p>其余的句子退后。只记发生了什么，不下结论。</p></div>

  <h2>状态</h2>
  <div class="cap" id="states"></div>
  <div class="cap"><button id="swt" type="button" role="switch" aria-checked="false" aria-label="这是一个开关"><span id="swl">关</span></button><span class="t">开关</span><button class="k6" type="button" data-toggle aria-pressed="false"><span class="ffh" aria-hidden="true">记</span>记下这一行</button></div>
  <div class="scene loading" id="scene"><div class="ln"></div><div class="dt"></div></div>
  <p id="sayst"></p>
</section>
</div>

<div class="dense"><span class="sign zi" role="img" aria-label="满满一页的字，分层排开" style="--r:url(__ASSET:signs/sign_crowd_relief.webp__)"><i></i><img src="__ASSET:signs/sign_crowd_ink.webp__" alt=""></span></div>

<div class="w">
<section>
  <h2>幻灯片</h2>
  <div class="deck" id="deck" tabindex="0" aria-label="幻灯片，用左右方向键翻页">
    <div class="sl on"><div class="tt">纪年</div><div class="h">小标题</div><span class="zi" aria-hidden="true" style="--r:url(__ASSET:signs/sign_one_relief.webp__);right:10cqw;top:7cqw;width:36.6cqw"><i></i><img src="__ASSET:signs/sign_one_ink.webp__" alt=""></span></div>
    <div class="sl"><div class="tt">一</div><div class="s">一个字，一句话。</div><span class="zi" aria-hidden="true" style="--r:url(__ASSET:signs/sign_turn_relief.webp__);left:5cqw;top:17cqw;width:90cqw"><i></i><img src="__ASSET:signs/sign_turn_ink.webp__" alt=""></span></div>
    <div class="sl"><span class="zi" aria-hidden="true" style="--r:url(__ASSET:signs/sign_crowd_relief.webp__);left:0;top:0;width:100cqw"><i></i><img src="__ASSET:signs/sign_crowd_ink.webp__" alt=""></span></div>
  </div>
  <div class="cap"><button id="prev" class="k1" type="button">上一页</button><button id="next" class="k1 p" type="button">下一页</button><span class="t" id="pg">1 / 3</span></div>

<script>
/*@include:motion.js*/
const RM=FF.rm,load=FF.load;

FF.ready.then(T=>{
 const main=getComputedStyle(document.documentElement).getPropertyValue('--c').trim();
 const pull=(y,h,i,x0,x1,yy,p)=>{const set=h?T.main:T.pale;if(set.length){FF.ribbon(y,set[i%set.length],FF.line([x0,yy],[x1,yy],60),58,p)}else{y.fillStyle=h?main:'#211C1C';y.fillRect(x0,yy-24,(x1-x0)*p,48)}};
 const D=[['第一项',40],['第二项',55],['第三项',48],['第四项',86,1]];
 const bc=document.getElementById('bars'),y=bc.getContext('2d');
 function bars(p){y.clearRect(0,0,bc.width,bc.height);y.textBaseline='middle';D.forEach(([n,v,h],i)=>{const yy=80+i*130,w=v/100*880;y.font='28px "Noto Serif SC",serif';y.fillStyle='#5C5650';y.fillText(n,0,yy);pull(y,h,i,330,330+w,yy,p);if(p>.98){y.font='26px "JetBrains Mono",monospace';y.fillStyle=h?main:'#211C1C';y.fillText(String(v),330+w+24,yy)}})}
 let done=false;const run=()=>{if(done)return;done=true;FF.play(bc,1500,FF.ease.pull,bars).then(()=>bars(1))};
 if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){run();io.disconnect()}},{rootMargin:'0px 0px -10% 0px'});io.observe(bc)}else run();
 setTimeout(run,8000);
});

(function(){const S=[...document.querySelectorAll('.sl')];let i=0,shown=S[0],tok=0;const pg=document.getElementById('pg');
 const cap=document.getElementById('captext');function say(){const e=S[i].querySelector('.s,.h');cap.textContent=e?e.textContent:''}
 function go(n){i=(n+S.length)%S.length;pg.textContent=(i+1)+' / '+S.length;say();const nw=S[i],me=++tok;
  if(FF.rm||nw===shown){S.forEach(s=>{s.classList.toggle('on',s===nw);FF.unmask(s)});shown=nw;return}
  FF.wipe(shown,280).then(()=>{if(me!==tok)return;S.forEach(s=>{if(s!==nw){s.classList.remove('on');FF.unmask(s)}});nw.classList.add('on');shown=nw;FF.smear(nw,{ms:600,dx:10})})}
 say();
 document.getElementById('next').onclick=()=>go(i+1);document.getElementById('prev').onclick=()=>go(i-1);
 document.getElementById('deck').addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(i+1);if(e.key==='ArrowLeft')go(i-1)})})();

(function(){const T={loading:['加载','去取。'],empty:['空','这里还没有记录。'],error:['错误','没有取到。再取一次。'],ok:['成功','取到了。'],saving:['保存中','记下这一行。']},box=document.getElementById('states');
 const go=k=>{document.getElementById('scene').className='scene '+k;document.getElementById('sayst').textContent=T[k][1];[...box.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));if(k==='error'&&window.mateError)window.mateError()};
 Object.keys(T).forEach(k=>{const b=document.createElement('button');b.type='button';b.className='k2';b.dataset.k=k;b.textContent=T[k][0];b.onclick=()=>go(k);box.appendChild(b)});FF.buttons(box);go('loading')})();
document.getElementById('swt').onclick=e=>{const b=e.currentTarget,v=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',v);document.getElementById('swl').textContent=v?'开':'关'};

/*@include:partners.js*/
</script>
