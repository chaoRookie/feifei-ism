<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Serif+SC:wght@400;600&family=Cormorant+Garamond:ital@1&family=JetBrains+Mono&display=swap">
<style>
:root{color-scheme:light;--paper:#F9F4E8;--ink:#211C1C;--ink-2:#5C5650;--ink-3:#6F6961;--line:#DDD6C4;--c:#4B1F96;--f-t:"ZCOOL XiaoWei","Songti SC",serif;--f-b:"Noto Serif SC","Songti SC",serif;--f-e:"Cormorant Garamond",Georgia,serif;--f-m:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
body,.deck{background-color:var(--paper);background-image:url(__ASSET:paper/xuan_fiber.webp__),url(__ASSET:paper/xuan_cloud.webp__);background-size:768px,1181px;background-blend-mode:multiply,multiply}
body{margin:0;color:var(--ink-2);font-family:var(--f-b);font-size:16.5px;line-height:1.9;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));overflow-x:clip}
.w{max-width:60rem;margin:0 auto}
.t{font-family:var(--f-m);font-size:.74rem;color:var(--ink-3);letter-spacing:.04em}
h1{font-family:var(--f-t);font-weight:400;font-size:1.3rem;margin:.2rem 0 0;letter-spacing:.14em;color:var(--ink)}
h2{font-family:var(--f-b);font-weight:400;font-size:1rem;margin:0;letter-spacing:.1em;color:var(--ink)}
b{font-weight:400;color:var(--ink)}
blockquote{margin:2.4rem 0;color:var(--ink);font-size:1.12rem;line-height:1.7}
a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--ink-3)}
.en{font-family:var(--f-e);font-style:italic;font-size:1.1rem;color:var(--ink-2)}
header{padding-block:3.5rem 2rem;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1rem;align-items:end;min-height:26rem}
header .sign{width:min(240px,100%);justify-self:end}
section{padding-block:96px 0}
section p{margin:0 0 1.5em;max-width:30rem}
.pp{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,3fr);column-gap:80px;margin-top:.9rem}
.pp>*{min-width:0}
.pi{font-size:.8rem;line-height:1.75;color:var(--ink-3)}
img{display:block;max-width:100%}
.sign{transition:clip-path 1.5s cubic-bezier(.3,.7,.2,1),transform 1.5s cubic-bezier(.3,.7,.2,1)}
.sign.pre{clip-path:inset(0 100% 0 0);transform:translateX(-14px)}
.wide{width:100%;margin-top:2rem}
.dense{width:100vw;max-width:100vw;margin:4.5rem calc(50% - 50vw) 0}
.dense img{width:100%}
.cap{display:flex;gap:1rem;flex-wrap:wrap;align-items:center;margin-top:1rem}
button{font:inherit;font-size:.92rem;line-height:1.4;color:var(--ink-2);background:none;border:0;border-radius:0;padding:.72rem 1.5rem .72rem 2.2rem;min-height:48px;cursor:pointer;position:relative;isolation:isolate;text-align:left;touch-action:manipulation;transition:color .3s,opacity .3s}
button::before{content:"";position:absolute;left:.3rem;top:50%;width:28px;height:16px;margin-top:-8px;background:url(__ASSET:btn/dab1.webp__) center/contain no-repeat;opacity:.55;transform:scale(.72);transform-origin:30% 50%;transition:transform .36s cubic-bezier(.3,.7,.2,1),opacity .28s,filter .36s}
button::after{content:"";position:absolute;inset:0;z-index:-1;background:url(__ASSET:btn/dab8.webp__) center/100% 100% no-repeat;opacity:0;transform:scale(.5,.72);transform-origin:12% 50%;transition:transform .38s cubic-bezier(.3,.7,.2,1),opacity .22s,filter .34s}
button:nth-of-type(3n+2)::after{background-image:url(__ASSET:btn/dab9.webp__)}
button:nth-of-type(3n)::after{background-image:url(__ASSET:btn/dab11.webp__)}
button:hover:not(:disabled){color:var(--ink)}
button:hover:not(:disabled)::before{opacity:.85;transform:scale(.9)}
button:active:not(:disabled)::before{opacity:1;transform:scale(1.18,1.12);filter:contrast(.72) brightness(1.2);transition:transform .16s cubic-bezier(.3,.7,.2,1),filter .16s}
button.p,button[aria-pressed=true]{color:var(--paper)}
button.p:hover:not(:disabled),button[aria-pressed=true]:hover:not(:disabled){color:var(--paper)}
button.p::before,button[aria-pressed=true]::before{opacity:0}
button.p::after,button[aria-pressed=true]::after{opacity:1;transform:none}
button.p:active:not(:disabled)::after,button[aria-pressed=true]:active:not(:disabled)::after{transform:scale(1.06,1.05);filter:contrast(.72) brightness(1.2);transition:transform .16s cubic-bezier(.3,.7,.2,1),filter .16s}
button:disabled{color:var(--ink-3);cursor:default}
button:disabled::before{opacity:.26;transform:scale(.6)}
button.busy::after{animation:ffbr 1.6s ease-in-out infinite alternate}
@keyframes ffbr{to{filter:contrast(.74) brightness(1.2)}}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:1px dotted var(--ink);outline-offset:3px}
button[role=switch]{width:88px;height:46px;min-height:46px;padding:0}
button[role=switch]::after{display:none}
button[role=switch]::before{left:0;width:38px;height:22px;margin-top:-11px;opacity:.45;transform:none;transition:left .4s cubic-bezier(.3,.7,.2,1),opacity .3s}
button[role=switch][aria-checked=true]::before{left:46px;opacity:1}
button[role=switch] span{position:absolute;right:6px;top:50%;margin-top:-.7em;font-size:.82rem;color:var(--ink-3)}
button[role=switch][aria-checked=true] span{right:auto;left:6px;color:var(--ink)}
button.plain,button.plain:hover{padding:.3rem 0;min-height:36px}
button.plain::before,button.plain::after{display:none}
@media (prefers-reduced-motion:reduce){button,button::before,button::after{transition:none}button.busy::after{animation:none}}
.scene{position:relative;height:5rem;max-width:30rem;margin-top:1rem}
.ln{position:absolute;left:0;right:0;bottom:1.2rem;height:1px;background:var(--ink)}
.dt{position:absolute;width:15px;height:15px;border-radius:50%;background:var(--ink);bottom:calc(1.2rem + 1px);left:0}
.loading .dt{animation:w 3.6s cubic-bezier(.45,.05,.55,.95) infinite alternate}
@keyframes w{to{left:calc(100% - 15px)}}
.saving .dt{left:62%;animation:hop .9s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-9px)}}
.ok .dt{left:calc(100% - 15px)}
.empty .dt{display:none}
.error .ln{right:38%}
.error .dt{left:calc(62% + 8px);bottom:0;background:var(--c);animation:fall .7s cubic-bezier(.5,0,.9,.4) both}
@keyframes fall{from{bottom:calc(1.2rem + 1px);left:calc(62% - 8px)}}
canvas{display:block;width:100%;height:auto}
.note{font-size:.8rem;color:var(--ink-3);margin-top:.8rem}
.deck{position:relative;aspect-ratio:16/9;margin-top:1.5rem;border:1px solid var(--line);overflow:hidden;container-type:inline-size}
.sl{position:absolute;inset:0;visibility:hidden}
.sl.on{visibility:visible}
.cap-text{display:none;font-size:.95rem;margin-top:.6rem}
@media (max-width:640px){.cap-text{display:block}}
.sl .tt{position:absolute;left:5cqw;top:5cqw;font-family:var(--f-m);font-size:1.25cqw;color:var(--ink-3)}
.sl .h{position:absolute;left:5cqw;bottom:6cqw;font-family:var(--f-t);font-size:3cqw;letter-spacing:.08em}
.sl .s{position:absolute;left:5cqw;bottom:5cqw;font-size:1.9cqw;max-width:42cqw}
.sl img{position:absolute;clip-path:inset(0 100% 0 0);transition:clip-path 1.5s cubic-bezier(.3,.7,.2,1),transform 1.5s cubic-bezier(.3,.7,.2,1);transform:translateX(-1.5cqw)}
.sl.on img{clip-path:inset(-2% -2% -2% -2%);transform:none}
.mate{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));width:56px;height:56px;image-rendering:pixelated;pointer-events:none;z-index:7}
.swim{position:fixed;left:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:96px;height:80px;image-rendering:pixelated;pointer-events:none;z-index:7}
footer{margin-top:5rem;padding-block:1.1rem 3rem;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2rem;align-items:end}
footer .n a{display:flex;gap:.8rem;font-size:.86rem;padding:.25rem 0;border:0}
footer .n span{font-size:.74rem;color:var(--ink-3);min-width:2.6em}
footer .m{font-family:var(--f-m);font-size:.7rem;color:var(--ink-3);line-height:1.8;margin-top:1rem}
footer .up{font-size:.8rem;margin-top:.5rem;color:var(--ink);border-bottom:1px solid var(--ink-3)}
.k{display:flex;gap:.55rem;align-items:flex-end}
.v{writing-mode:vertical-rl;font-size:.84rem;letter-spacing:.3em;color:var(--ink)}
.seal{width:2.3rem;height:2.3rem;min-height:0;background:var(--c);text-align:center;color:var(--paper);font-family:var(--f-t);font-size:.82rem;line-height:1.05;display:grid;grid-template-columns:1fr 1fr;place-items:center;padding:.2rem;transform:rotate(-1.5deg)}
.seal::before,.seal::after{display:none}
.seal,.seal:hover{min-height:0;color:var(--paper)}
@media (max-width:640px){header{grid-template-columns:1fr;min-height:0}header .sign{justify-self:start;width:160px}.pp{display:block}.pi{border-left:1px solid var(--ink);padding-left:.8rem;margin:0 0 1.5em}footer{gap:1rem}}
@media (prefers-reduced-motion: reduce){.sl img,.sign{transition:none}.dt{animation:none!important}.loading .dt{left:40%}}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
</style>

<div class="w">
<header>
  <div>
    <div class="t">纪年　人或事　第乙签</div>

<section>
  <h2>幻灯片</h2>
  <div class="deck" id="deck" tabindex="0" aria-label="幻灯片，用左右方向键翻页">
    <div class="sl on"><div class="tt">纪年</div><div class="h">小标题</div><img src="__ASSET:signs/sign_one.webp__" alt="" style="right:10cqw;top:7cqw;height:42cqw"></div>
    <div class="sl"><div class="tt">一</div><div class="s">一个字，一句话。</div><img src="__ASSET:signs/sign_turn.webp__" alt="" style="left:5cqw;top:17cqw;width:90cqw"></div>
    <div class="sl"><img src="__ASSET:signs/sign_crowd.webp__" alt="" style="left:0;top:0;width:100cqw"></div>
  </div>

  <div class="k"><div class="v">你的名字 记</div><button class="seal" id="seal" type="button" aria-label="肥肥主义的印"><span>肥</span><span>肥</span><span>主</span><span>义</span></button></div>

<canvas class="mate" id="mate" width="64" height="64" hidden aria-hidden="true"></canvas>
<canvas class="swim" id="swim" width="128" height="102" hidden aria-hidden="true"></canvas>

<script>
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const smooth=t=>{const s=1-t;return Math.min(1,Math.max(0,t*t*t*(10*s*s+5*s*t+t*t)))};
function tween(ms,fn){return new Promise(r=>{if(RM||ms<=0){fn(1);r();return}const a=performance.now();(function f(n){const t=Math.min(1,(n-a)/ms);fn(smooth(t));t<1?requestAnimationFrame(f):r()})(a)})}
const load=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=s});
const SLOT={cur:null,P:{error:4,load:3,hidden:2,rare:1},req(k){if(this.cur&&this.P[this.cur]>=this.P[k])return false;this.cur=k;dispatchEvent(new CustomEvent('mate',{detail:k}));return true},rel(k){if(this.cur===k)this.cur=null}};
function tint(img,col){const c=document.createElement('canvas');c.width=img.width;c.height=img.height;const x=c.getContext('2d');x.drawImage(img,0,0);x.globalCompositeOperation='multiply';x.fillStyle=col;x.fillRect(0,0,c.width,c.height);x.globalCompositeOperation='destination-in';x.drawImage(img,0,0);return c}
function ribbon(x,img,pts,w,prog){prog=prog==null?1:prog;const L=[0];for(let i=1;i<pts.length;i++)L[i]=L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);const T=L[L.length-1];
 for(let i=0;i<pts.length-1;i++){if(L[i]/T>prog)break;const a=pts[i],b=pts[i+1],g=Math.atan2(b[1]-a[1],b[0]-a[0]),d=L[i+1]-L[i],sx=L[i]/T*img.width,sw=Math.max(1,d/T*img.width);x.save();x.translate(a[0],a[1]);x.rotate(g);x.drawImage(img,sx,0,sw,img.height,0,-w/2,d+1.5,w);x.restore()}}
const line=(a,b,n)=>[...Array(n+1)].map((_,i)=>[a[0]+(b[0]-a[0])*i/n,a[1]+(b[1]-a[1])*i/n]);

(function(){if(RM)return;let P=[...document.querySelectorAll('.sign')].filter(s=>s.getBoundingClientRect().top>innerHeight*.92);P.forEach(s=>s.classList.add('pre'));const chk=()=>{P=P.filter(s=>{if(s.getBoundingClientRect().top<innerHeight*.92){s.classList.remove('pre');return false}return true});if(!P.length)removeEventListener('scroll',chk)};addEventListener('scroll',chk,{passive:true});addEventListener('resize',chk);setTimeout(()=>{P.forEach(s=>s.classList.remove('pre'));P=[]},8000)})();

Promise.all(['__ASSET:strokes/st0.webp__','__ASSET:strokes/st1.webp__','__ASSET:strokes/st2.webp__','__ASSET:strokes/st3.webp__','__ASSET:strokes/st4.webp__','__ASSET:strokes/st5.webp__'].map(load)).then(ims=>{
 const ok=ims.filter(Boolean);
 const main=getComputedStyle(document.documentElement).getPropertyValue('--c').trim();
 const ink=ok.map(i=>tint(i,'#7C6C66')),col=ok.map(i=>tint(i,main));
 const pull=(y,h,i,x0,x1,yy,p)=>{if(ok.length){ribbon(y,(h?col:ink)[i%ink.length],line([x0,yy],[x1,yy],60),58,p)}else{y.fillStyle=h?main:'#211C1C';y.fillRect(x0,yy-24,(x1-x0)*p,48)}};
 const D=[['第一项',40],['第二项',55],['第三项',48],['第四项',86,1]];
 const bc=document.getElementById('bars'),y=bc.getContext('2d');
 function bars(p){y.clearRect(0,0,bc.width,bc.height);y.textBaseline='middle';D.forEach(([n,v,h],i)=>{const yy=80+i*130,w=v/100*880;y.font='28px "Noto Serif SC",serif';y.fillStyle='#5C5650';y.fillText(n,0,yy);pull(y,h,i,330,330+w,yy,p);if(p>.98){y.font='26px "JetBrains Mono",monospace';y.fillStyle=h?main:'#211C1C';y.fillText(String(v),330+w+24,yy)}})}
 let done=false;const run=()=>{if(done)return;done=true;tween(1500,bars).then(()=>bars(1))};
 if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){run();io.disconnect()}},{rootMargin:'0px 0px -10% 0px'});io.observe(bc)}else run();
 setTimeout(run,8000);
});

(function(){const S=[...document.querySelectorAll('.sl')];let i=0;const pg=document.getElementById('pg');
 const cap=document.getElementById('captext');function say(){const e=S[i].querySelector('.s,.h');cap.textContent=e?e.textContent:''}
 function go(n){S[i].classList.remove('on');i=(n+S.length)%S.length;S[i].classList.add('on');pg.textContent=(i+1)+' / '+S.length;say()}
 say();
 document.getElementById('next').onclick=()=>go(i+1);document.getElementById('prev').onclick=()=>go(i-1);
 document.getElementById('deck').addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(i+1);if(e.key==='ArrowLeft')go(i-1)})})();

(function(){const T={loading:['加载','去取。'],empty:['空','这里还没有记录。'],error:['错误','没有取到。再取一次。'],ok:['成功','取到了。'],saving:['保存中','记下这一行。']},box=document.getElementById('states');
 const go=k=>{document.getElementById('scene').className='scene '+k;document.getElementById('sayst').textContent=T[k][1];[...box.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));if(k==='error'&&window.mateError)window.mateError()};
 Object.keys(T).forEach(k=>{const b=document.createElement('button');b.type='button';b.dataset.k=k;b.textContent=T[k][0];b.onclick=()=>go(k);box.appendChild(b)});go('loading')})();
document.getElementById('swt').onclick=e=>{const b=e.currentTarget,v=b.getAttribute('aria-checked')!=='true';b.setAttribute('aria-checked',v);document.getElementById('swl').textContent=v?'开':'关'};
document.getElementById('up').onclick=()=>scrollTo({top:0,behavior:RM?'auto':'smooth'});

Promise.all([load('__ASSET:partners/dswim.webp__'),load('__ASSET:partners/dragon_peek.webp__')]).then(([dragon,dpeek])=>{
 const mc=document.getElementById('mate'),mx=mc.getContext('2d'),sc=document.getElementById('swim'),sx=sc.getContext('2d');let run=0;
 function draw(cx,img,c,i){if(!img)return;const fw=img.width/25;cx.imageSmoothingEnabled=false;cx.clearRect(0,0,c.width,c.height);cx.drawImage(img,Math.floor(i%25)*fw,0,fw,img.height,0,0,c.width,c.width*img.height/fw)}
 function stop(){run++;mc.hidden=true;sc.hidden=true}
 addEventListener('mate',stop);
 function peek(kind,ms){const who=[dpeek].filter(Boolean);if(!who.length||!SLOT.req(kind))return;const pal=who[Math.floor(Math.random()*who.length)];const me=++run;mc.hidden=false;if(RM){draw(mx,pal,mc,12);setTimeout(()=>{if(me===run){mc.hidden=true;SLOT.rel(kind)}},ms);return}const a=performance.now();(function f(n){if(me!==run)return;const k=(n-a)/ms;if(k>=1){mc.hidden=true;SLOT.rel(kind);return}draw(mx,pal,mc,Math.floor(k*25));requestAnimationFrame(f)})(a)}
 function swim(){if(!dragon||RM||!SLOT.req('rare'))return;const me=++run;sc.hidden=false;const a=performance.now();(function f(n){if(me!==run)return;const k=(n-a)/14000;if(k>=1){sc.hidden=true;SLOT.rel('rare');return}draw(sx,dragon,sc,n/90);sc.style.transform='translateX('+(-110+k*(innerWidth+220))+'px)';requestAnimationFrame(f)})(a)}
 peek('load',1800);
 if(location.hash==='#longlong'||Math.random()<1/30)setTimeout(swim,2400);
 let taps=0;['first','seal'].forEach(i=>document.getElementById(i).addEventListener('click',()=>{if(++taps>=3){taps=0;peek('hidden',2400)}}));
 window.mateError=()=>peek('error',2400);
});
</script>
